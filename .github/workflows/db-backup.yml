name: Database Backup

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y wget gnupg2 lsb-release curl
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/postgresql.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Backup Database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --clean --if-exists | gzip -9 > backup.sql.gz

      - name: Encrypt Backup
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Use GPG to encrypt the compressed archive
          # Compressing first with gzip -9 shrinks >100MB plain SQL down to ~10-15MB
          gpg --symmetric --cipher-algo AES256 --batch --yes --passphrase "$PASSPHRASE" -o backup.sql.gz.gpg backup.sql.gz
          rm -f backup.sql.gz

          # Safeguard: if the encrypted backup exceeds 50MB, split into chunks under GitHub's 100MB limit
          FILESIZE=$(stat -c%s "backup.sql.gz.gpg")
          if [ "$FILESIZE" -gt 50000000 ]; then
            split -b 50M backup.sql.gz.gpg backup.sql.gz.gpg.part_
            rm -f backup.sql.gz.gpg
          fi

      - name: Commit and push backup
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -B backups
          # Remove legacy uncompressed backup if present on branch
          git rm -f backup.sql.gpg 2>/dev/null || true
          # Commit the ENCRYPTED compressed file(s)
          git add -f backup.sql.gz.gpg*
          git commit -m "daily db backup (encrypted & compressed)" || echo "No changes to commit"
          git push origin backups --force
          
      - name: Upload artifact (optional history)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: backup.sql.gz.gpg*
          retention-days: 7
